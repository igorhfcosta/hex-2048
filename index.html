<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e19" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="HEX 3072: some peças iguais em seis direções e alcance 3.072. Continue jogando para desbloquear 24.576." />
<title>HEX 3072 · Jogo de fusão hexagonal</title>
<style>
:root{color-scheme:dark;--bg:#0b0e19;--panel:#14182a;--panel2:#1a1f35;--line:#2e3653;--text:#f6f7ff;--muted:#a0abc7;--mint:#85f1c5;--purple:#ac9af9;--gold:#fdd591;--board-size:400px}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse 70% 55% at 6% 0%,#232144 0%,transparent 78%),radial-gradient(ellipse 65% 65% at 100% 95%,#102b31 0%,transparent 72%),var(--bg)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.app{height:100vh;height:100dvh;width:100%;padding:clamp(8px,1.8dvh,20px) 12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.game{width:min(100%,580px);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2dvh,14px);min-width:0}
.hud{width:100%;display:flex;align-items:center;justify-content:space-between;gap:clamp(8px,2vw,18px)}
.identity{min-width:0;flex:1 1 auto}
.identity-title{display:flex;align-items:baseline;gap:clamp(5px,1.2vw,10px);font-size:clamp(32px,7vw,55px);line-height:.95;font-weight:900;letter-spacing:-2px;white-space:nowrap}
.identity-title span{color:var(--mint);font-size:.58em;font-weight:900;letter-spacing:-.04em}
.variants{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;flex-wrap:wrap}
.variants select,.variants button{appearance:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:clamp(9px,2.3vw,12px);font-weight:700;min-height:29px}
.variants button:hover,.variants select:focus-visible{border-color:var(--mint)}
.variants button[hidden]{display:none!important}
body{--bg:#080713;--panel:#141028;--panel2:#211737;--line:#544078;--text:#fff8ff;--muted:#b3a3d4;--mint:#4ef5d5;--purple:#e189ff;--gold:#faff8b;background:radial-gradient(circle at 30% 30%,#271347 0%,#080713 75%)}
#board .tile{filter:drop-shadow(0 0 8px #4ef5d555)}
.score{background:#211737;border-color:#544078}
.score small{color:#c3b3db}
.icon-button{background:#2a1d42;border-color:#5b4981;color:#f4eaff}
.variants{margin-top:2px}
@media(max-height:450px){.variants{gap:3px}.variants select,.variants button{min-height:23px;padding:3px 5px;font-size:10px}}
.stats{display:flex;gap:clamp(5px,1.4vw,10px);flex:none}
.score{background:#211737;border:1px solid #544078;border-radius:13px;min-width:clamp(76px,21vw,112px);padding:9px clamp(6px,2vw,13px);text-align:center;box-shadow:0 3px 12px #0002}
.score small{display:block;color:#c3b3db;text-transform:uppercase;font-weight:850;font-size:clamp(8px,1.8vw,10px);letter-spacing:.5px}
.score strong{display:block;color:var(--text);font-size:clamp(16px,4.3vw,25px);margin-top:3px;font-weight:900;letter-spacing:-.8px;line-height:1.2;font-variant-numeric:tabular-nums}
.score.best strong{color:var(--gold)}
.toolbar{width:100%;display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:37px}
.actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.icon-button{width:clamp(32px,8vw,42px);height:clamp(32px,8vw,42px);display:grid;place-items:center;color:#f4eaff;border:1px solid #5b4981;border-radius:11px;background:#2a1d42;transition:background .14s,transform .14s}
.icon-button:hover:not(:disabled){background:#443164;transform:translateY(-1px)}
.icon-button:disabled{opacity:.32;cursor:not-allowed}
.icon-button svg{width:19px;height:19px}
.icon-button.primary{background:#295548;border-color:#70cbaa;color:#bbffdc}
.icon-button.primary:hover{background:#35735e}
.board-wrap{width:var(--board-size);height:var(--board-size);aspect-ratio:1;max-width:100%;border-radius:18px;border:1px solid #2f3e57;background:linear-gradient(145deg,#1b2438,#111a2d);box-shadow:0 12px 40px #0003;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;flex:none}
#board{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
#board:active{cursor:grabbing}
#cell-layer .cell-bg{fill:#27354b;stroke:#405470;stroke-width:1.35}
#board .tile{filter:drop-shadow(0 3px 3px #02091d45)}
#board .tile .tile-shape{stroke:#ffffff27;stroke-width:1.2}
#board .tile-value{font-weight:900;text-anchor:middle;dominant-baseline:central;font-family:Inter,system-ui,sans-serif;letter-spacing:-1.3px;pointer-events:none}
#board .spawn{animation:popIn .22s cubic-bezier(.1,.6,.3,1.65)}
#board .merged{animation:mergeIn .28s cubic-bezier(.17,.7,.4,1.2)}
@keyframes popIn{from{opacity:0;scale:.1}to{opacity:1;scale:1}}
@keyframes mergeIn{0%{scale:.9}50%{scale:1.16}100%{scale:1}}
.bottom{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:clamp(9px,2.3vw,12px);line-height:1.25;min-height:19px}
.bottom strong{color:var(--mint)}
.bottom-note{flex:1;text-align:right}
.toast{position:fixed;left:50%;bottom:23px;transform:translate(-50%,22px);background:#223b40;border:1px solid #75d5bb;color:#effff7;font-size:13px;font-weight:700;padding:11px 19px;border-radius:12px;box-shadow:0 12px 30px #0007;z-index:39;opacity:0;pointer-events:none;transition:transform .22s,opacity .22s;max-width:min(90vw,500px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:40;background:#050813d9;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:14px}
.overlay.hidden{display:none}
.modal{background:linear-gradient(155deg,#242d46,#151a2e);border:1px solid #52617b;border-radius:23px;padding:clamp(15px,4vw,26px);box-shadow:0 30px 100px #0009;max-width:440px;width:100%;max-height:90dvh;overflow-y:auto;text-align:center}
.modal-graphic{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 12px;background:#293f48;color:var(--mint);font-size:30px;border-radius:18px}
.modal h2{font-size:23px;letter-spacing:-.6px;margin:0 0 10px}
.modal p{font-size:13px;line-height:1.55;color:#c0cce1;margin:0 0 16px}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.modal-actions button{padding:11px 15px;border-radius:12px;font-weight:800;border:1px solid #485874}
.modal-actions .primary{background:var(--mint);color:#10252c;border-color:var(--mint)}
.modal-actions .secondary{background:#26334c;color:#f5f7ff}
.help-list{text-align:left;font-size:12px;line-height:1.5;color:#bcc8df;margin:0 0 17px;padding-left:18px}
.help-list li{margin:7px 0}
.help-list b{color:#f2f5ff}
.radial-touch{position:fixed;top:0;left:0;width:192px;height:192px;z-index:35;pointer-events:none;visibility:hidden;opacity:0;transform:translate(-50%,-50%) scale(.78);transition:opacity .14s ease,transform .18s ease,visibility .14s}
.radial-touch.visible{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.radial-touch::before{content:"";position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#1a2933e8 0%,#20384cef 46%,#16243aea 72%,#16243a9e 100%);border:1px solid #8cf4c899;box-shadow:0 18px 60px #000b,0 0 0 7px #85f1c516;backdrop-filter:blur(9px)}
.radial-touch-center{position:absolute;top:50%;left:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid #708e9a88;background:#0e1c29;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#c0eadf;font-size:10px;font-weight:850;letter-spacing:.4px;text-transform:uppercase}
.radial-touch-center span:first-child{font-size:20px;line-height:1;color:var(--mint)}
.radial-touch-center span:last-child{font-size:8px;margin-top:4px}
.radial-arrow{position:absolute;top:50%;left:50%;width:45px;height:45px;border:1px solid #657b93;border-radius:14px;background:#273950e8;display:flex;align-items:center;justify-content:center;color:#e8f5ff;box-shadow:0 4px 10px #02091677;transition:background .09s,box-shadow .09s,border-color .09s}
.radial-arrow svg{width:25px;height:25px}
.radial-arrow.active{border-color:#c2ffe9;background:#68ddba;color:#10252c;box-shadow:0 0 20px #85f1c58a;scale:1.1}
.radial-touch.committed .radial-touch-center{background:#2f7567;border-color:#93f0c8;color:#fff}
@media(max-width:390px){.identity-title{font-size:clamp(30px,10vw,39px)}.score{padding:7px 5px}.actions{gap:5px}}
@media(max-height:540px){.score{padding-top:5px;padding-bottom:5px}.game{gap:5px}.toolbar-caption{font-size:10px}.bottom-note{font-size:10px}}
@media(max-height:380px){.app{padding:3px 6px}.game{gap:3px}.bottom-note{display:none}.identity-title{font-size:30px}.toolbar{min-height:30px}.icon-button{height:30px;width:30px}.score strong{font-size:15px}.bottom{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app"><main class="game" aria-label="HEX 3072">
  <header class="hud"><div class="identity"><div class="identity-title">HEX <span>3072</span></div></div>
    <div class="stats" aria-label="Placar"><div class="score"><small>Pontuação</small><strong id="score">0</strong></div><div class="score best"><small>Recorde</small><strong id="best">0</strong></div></div>
  </header>
  <div class="toolbar">
    <div class="actions">
      <button class="icon-button" id="undo-btn" disabled title="Desfazer jogada" aria-label="Desfazer jogada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button>
      <button class="icon-button primary" id="restart-btn" title="Novo jogo" aria-label="Novo jogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11a9 9 0 1 1 3 7M3 4v7h7"/></svg></button>
      <button class="icon-button" id="sound-btn" title="Alternar som" aria-label="Alternar som"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg></button>
      <button class="icon-button" id="help-btn" title="Como jogar" aria-label="Como jogar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.1 2c-1.15.85-1.6 1.3-1.6 2.5M12 17h.01"/></svg></button>
    </div>
  </div>
  <div class="board-wrap"><svg id="board" viewBox="30 30 540 540" role="img" aria-label="Tabuleiro hexagonal"><title>HEX 3072 - tabuleiro interativo</title><g id="cell-layer"></g><g id="tile-layer"></g><g id="fx-layer" pointer-events="none"></g></svg></div>
  <div class="variants" aria-label="Modos e opções">
    <select id="size-select" aria-label="Tamanho do tabuleiro"><option value="7">7 casas</option><option value="19">19 casas</option><option value="37">37 casas</option><option value="61">61 casas</option></select>
    <button id="achievements-btn" type="button">Conquistas</button>
    <button id="leaderboard-btn" type="button">Ranking</button>
    <button id="install-btn" type="button" hidden>Instalar app</button>
  </div>
  <div class="bottom"><span><strong id="tile-count">2 peças</strong> · <span id="moves">0</span> jogadas</span><span class="bottom-note">Teclado <strong>7 9 4 6 1 3</strong> · Celular: toque e segure</span></div>
</main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="radial-touch" id="radial-touch" aria-hidden="true"><div class="radial-touch-center" id="radial-center"><span>⬡</span><span>Arraste</span></div></div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal"><div class="modal-graphic" id="modal-icon">✦</div><h2 id="modal-title">Como jogar</h2><p id="modal-copy"></p><ul id="modal-help" class="help-list" hidden></ul><div class="modal-actions" id="modal-actions"></div></div></div>
<script>
(()=>{'use strict';
  const NS='http://www.w3.org/2000/svg';
  const params=new URLSearchParams(window.location.search);
  const boardCount=[7,19,37,61].includes(Number(params.get('size')))?Number(params.get('size')):19;
  const boardRadius={7:1,19:2,37:3,61:4}[boardCount];
  const gameMode='free', GOAL=3072;
  const storageKey='hex24576_free_'+boardCount+'_v1',previousStorageKey='hex2187_v1';
  const randomUnit=()=>Math.random();
  document.getElementById('size-select').value=String(boardCount);
  document.getElementById('size-select').addEventListener('change',e=>{
    const size=e.target.value;location.assign(location.pathname+(size==='19'?'':'?size='+size));
  });
  const config={angles:[-120,-60,0,60,120,180],labels:['Noroeste','Nordeste','Leste','Sudeste','Sudoeste','Oeste'],keys:['7','9','6','3','1','4']};
  const keyDirections=Object.fromEntries(config.keys.map((key,index)=>[key,index]));
  const vectors=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
  const svg=document.getElementById('board'),cellsLayer=document.getElementById('cell-layer'),tileLayer=document.getElementById('tile-layer');
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),movesEl=document.getElementById('moves'),undoBtn=document.getElementById('undo-btn');
  const overlay=document.getElementById('overlay'),toastEl=document.getElementById('toast');
  let session=null,best=0,soundOn=false,audioContext=null,animationBusy=false,modalOpen=false,toastTimer=null;
  const achievements=[['first','Primeira fusão','Realize a primeira fusão'],['96','Primeiros passos','Alcance 96'],['768','Potência crescente','Alcance 768'],['3072','Meta alcançada','Alcance 3.072'],['6144','Além da meta','Alcance 6.144'],['12288','Hex mestre','Alcance 12.288'],['24576','Lenda hexagonal','Alcance 24.576'],['100moves','Persistência','Faça 100 jogadas'],['1000pts','Pontuador','Faça 1.000 pontos']];
  let unlocked=new Set();
  try{unlocked=new Set(JSON.parse(localStorage.getItem('hex24576_achievements_v1')||'[]'));}catch(_){}
  function unlock(id){if(unlocked.has(id))return;unlocked.add(id);try{localStorage.setItem('hex24576_achievements_v1',JSON.stringify([...unlocked]));}catch(_){}const label=achievements.find(a=>a[0]===id)?.[1];if(label)toast('Conquista: '+label);}
  document.body.dataset.theme='neon';
  function celebrate(out){
    const fx=document.getElementById('fx-layer');
    for(const id of out.mergedIds){const p=cellMap[id];if(!p)continue;
      for(let i=0;i<7;i++){const angle=i*Math.PI*2/7,c=node('circle',{cx:p.x,cy:p.y,r:Math.max(2,HR*.07),fill:'#b1ffde',opacity:.9});fx.appendChild(c);
        const ani=c.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(angle)*HR*.8}px,${Math.sin(angle)*HR*.8}px) scale(.2)`,opacity:0}],{duration:360,easing:'ease-out'});ani.onfinish=()=>c.remove();}
    }
    const highest=Math.max(0,...out.mergedIds.map(id=>session.cells[id]));
    for(const goal of [768,3072,6144,12288])if(highest>=goal&&!session.milestones.includes(goal)){session.milestones.push(goal);toast('Novo marco: '+goal.toLocaleString('pt-BR')+'!');}
  }
  function evaluateAwards(out){if(out.mergedIds.length)unlock('first');const max=Math.max(...Object.values(session.cells));for(const goal of [96,768,3072,6144,12288,24576])if(max>=goal)unlock(String(goal));if(session.moves>=100)unlock('100moves');if(session.score>=1000)unlock('1000pts');}
  function mergeAudio(out){if(!out.mergedIds.length){sound(260,'move');return;}const peak=Math.max(...out.mergedIds.map(id=>session.cells[id]));const tier=Math.round(Math.log(peak/3)/Math.log(2));sound(Math.min(1050,190*Math.pow(2,tier/12)),'merge');}
  const coords=[];
  function node(name,attrs={},text){const el=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));if(text!==undefined)el.textContent=text;return el;}
  const HR=157/(boardRadius+1);
  for(let q=-boardRadius;q<=boardRadius;q++)for(let r=-boardRadius;r<=boardRadius;r++)if(Math.abs(q+r)<=boardRadius)coords.push({id:`${q},${r}`,q,r,x:300+Math.sqrt(3)*HR*(q+r/2),y:300+1.5*HR*r});
  const cellMap=Object.fromEntries(coords.map(p=>[p.id,p]));
  function lanesFor(d){
    const parts=new Map(), angle=config.angles[d]*Math.PI/180,dx=Math.cos(angle),dy=Math.sin(angle);
    const [dq,dr]=vectors[d];
    for(const p of coords){
      const lane=dr===0?`r${p.r}`:dq===0?`q${p.q}`:`s${p.q+p.r}`;
      if(!parts.has(lane))parts.set(lane,[]);
      parts.get(lane).push(p);
    }
    return [...parts.values()].map(line=>line.sort((a,b)=>(b.x-a.x)*dx+(b.y-a.y)*dy).map(p=>p.id));
  }
  const LINES=config.angles.map((_,d)=>lanesFor(d));
  function isValidTile(v){if(!Number.isSafeInteger(v)||v<3||v%3!==0)return false;v/=3;while(v>1&&v%2===0)v/=2;return v===1;}
  function validCells(s){return s?.cells&&coords.every(p=>s.cells[p.id]===0||isValidTile(s.cells[p.id]));}
  function safeSave(){try{localStorage.setItem(storageKey,JSON.stringify({session,best,soundOn,goal:GOAL}));}catch(e){}}
  function readStorage(){
    try{
      const raw=JSON.parse(localStorage.getItem(storageKey));
      const legacy=raw?null:JSON.parse(localStorage.getItem(previousStorageKey));
      if(validCells(raw?.session))session={cells:Object.fromEntries(coords.map(p=>[p.id,raw.session.cells[p.id]])),score:Math.max(0,Number(raw.session.score)||0),moves:Math.max(0,Number(raw.session.moves)||0),won:raw.goal===GOAL?!!raw.session.won:Object.values(raw.session.cells).some(v=>v>=GOAL),undo:null,merges:Math.max(0,Number(raw.session.merges)||0),startedAt:Number(raw.session.startedAt)||Date.now(),milestones:Array.isArray(raw.session.milestones)?raw.session.milestones:[]};
      if(Number.isFinite(raw?.best))best=Math.max(0,Math.floor(raw.best));
      const oldSound=raw?.soundOn??legacy?.soundOn;
      if(typeof oldSound==='boolean')soundOn=oldSound;
    }catch(e){}
  }
  function emptyCells(){return Object.fromEntries(coords.map(p=>[p.id,0]));}
  function spawn(cells){const spaces=coords.map(p=>p.id).filter(id=>!cells[id]);if(!spaces.length)return null;const id=spaces[Math.floor(randomUnit()*spaces.length)];cells[id]=randomUnit()<.9?3:6;return id;}
  function makeSession(){const cells=emptyCells();spawn(cells);spawn(cells);return {cells,score:0,moves:0,won:false,undo:null,merges:0,startedAt:Date.now(),milestones:[]};}
  function simulate(cells,d){
    const next={...cells};let gained=0,changed=false;const mergedIds=[],paths=[];
    for(const lane of LINES[d]){
      const moving=lane.filter(id=>cells[id]!==0).map(id=>({id,value:cells[id]}));
      const results=[];
      for(let i=0;i<moving.length;i++){
        const current=moving[i],target=lane[results.length];
        if(i+1<moving.length&&moving[i+1].value===current.value){
          const other=moving[++i];results.push(current.value*2);gained+=current.value*2;mergedIds.push(target);
          paths.push({source:current.id,target,value:current.value},{source:other.id,target,value:other.value});
        }else{results.push(current.value);paths.push({source:current.id,target,value:current.value});}
      }
      for(let i=0;i<lane.length;i++){const value=results[i]||0;if(next[lane[i]]!==value)changed=true;next[lane[i]]=value;}
    }
    return {next,gained,changed,mergedIds,paths};
  }
  function legalMove(cells){return LINES.some((_,d)=>simulate(cells,d).changed);}
  const colors={3:['#e5f8ee','#193329'],6:['#baf1d6','#153c31'],12:['#83d8d1','#153b43'],24:['#77b9fa','#152f50'],48:['#b09df9','#29224e'],96:['#d98af4','#42254f'],192:['#f5a5bd','#522b44'],384:['#f9b48e','#5d3028'],768:['#ffce7c','#56381b'],1536:['#e8e47b','#3f421f'],3072:['#fef0a4','#5c451b'],6144:['#baffd1','#214934'],12288:['#8cf8ff','#134a50'],24576:['#fcf6ff','#4b2171']};
  function theme(value){return colors[value]||['#ffd77d','#55401a'];}
  function polyPoints(radius,offset=-90){return Array.from({length:6},(_,k)=>{const a=(offset+k*60)*Math.PI/180;return `${(Math.cos(a)*radius).toFixed(3)},${(Math.sin(a)*radius).toFixed(3)}`;}).join(' ');}
  function shape(fill,isBg=false){return node('polygon',{points:polyPoints(HR*.965),fill,class:isBg?'cell-bg':'tile-shape','stroke-linejoin':'round'});}
  function tileElement(p,value,cls=''){
    const [bg,fg]=theme(value),g=node('g',{class:`tile ${cls}`.trim(),style:`transform-origin:${p.x}px ${p.y}px`});
    g.setAttribute('transform',`translate(${p.x} ${p.y})`);
    g.appendChild(shape(bg));
    const digits=String(value).length,maxFont=Math.max(9,Math.min(HR*.69,35-Math.max(0,digits-2)*6));
    g.appendChild(node('text',{'class':'tile-value',x:0,y:1,'font-size':maxFont,fill:fg},String(value)));
    return g;
  }
  function drawBoard(spawned=null,merged=[]){
    if(!session)return;
    cellsLayer.replaceChildren();tileLayer.replaceChildren();
    for(const p of coords){const group=node('g',{transform:`translate(${p.x} ${p.y})`});group.appendChild(shape('',true));cellsLayer.appendChild(group);const value=session.cells[p.id];if(value)tileLayer.appendChild(tileElement(p,value,p.id===spawned?'spawn':merged.includes(p.id)?'merged':''));}
    scoreEl.textContent=session.score.toLocaleString('pt-BR');bestEl.textContent=best.toLocaleString('pt-BR');movesEl.textContent=session.moves.toLocaleString('pt-BR');undoBtn.disabled=!session.undo;
    const n=Object.values(session.cells).filter(Boolean).length;document.getElementById('tile-count').textContent=n===1?'1 peça':`${n} peças`;
  }
  function sound(frequency=450,type='move'){
    if(!soundOn)return;
    try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();
      const o=audioContext.createOscillator(),g=audioContext.createGain(),now=audioContext.currentTime;o.type='sine';o.frequency.setValueAtTime(frequency,now);o.frequency.exponentialRampToValueAtTime(type==='merge'?frequency*1.5:frequency*.85,now+.085);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+.13);o.connect(g).connect(audioContext.destination);o.start(now);o.stop(now+.14);
    }catch(e){}
  }
  function toast(message){clearTimeout(toastTimer);toastEl.textContent=message;toastEl.classList.add('show');toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2400);}
  function move(d){
    if(animationBusy||modalOpen||d<0||d>5)return;
    const out=simulate(session.cells,d);if(!out.changed)return;
    session.undo={cells:{...session.cells},score:session.score,moves:session.moves,won:session.won,merges:session.merges,milestones:[...session.milestones]};
    session.cells=out.next;session.score+=out.gained;session.moves++;session.merges+=out.mergedIds.length;
    if(session.score>best)best=session.score;
    animationBusy=true;mergeAudio(out);
    tileLayer.replaceChildren();
    for(const path of out.paths){const src=cellMap[path.source],dst=cellMap[path.target],piece=tileElement(src,path.value);tileLayer.appendChild(piece);
      if(path.source!==path.target){const x=dst.x-src.x,y=dst.y-src.y,mover=node('g');while(piece.firstChild)mover.appendChild(piece.firstChild);piece.appendChild(mover);
        try{mover.animate([{transform:'translate(0px,0px)'},{transform:`translate(${x}px,${y}px)`}],{duration:155,easing:'cubic-bezier(.28,.65,.44,1)',fill:'forwards'});}catch(e){}
      }
    }
    setTimeout(()=>{const created=spawn(session.cells);drawBoard(created,out.mergedIds);safeSave();animationBusy=false;
      celebrate(out);evaluateAwards(out);
      if(!session.won&&Object.values(session.cells).some(v=>v>=GOAL)){session.won=true;safeSave();sound(850,'merge');openModal('won');}
      else if(!legalMove(session.cells))openModal('lost');
    },160);
  }
  function controlArrow(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4m0 0-7 7m7-7 7 7"/></svg>';}
  function fitBoard(){
    const app=document.querySelector('.app'),game=document.querySelector('.game'),hud=document.querySelector('.hud'),toolbar=document.querySelector('.toolbar'),bottom=document.querySelector('.bottom');
    const height=window.visualViewport?.height||window.innerHeight;
    const viewportWidth=window.visualViewport?.width||window.innerWidth;
    const spacing=parseFloat(getComputedStyle(game).rowGap)||12;
    const padding=parseFloat(getComputedStyle(app).paddingTop)||12;
    const variants=document.querySelector('.variants');const remaining=height-hud.offsetHeight-toolbar.offsetHeight-bottom.offsetHeight-variants.offsetHeight-spacing*4-padding*2-4;
    const size=Math.max(70,Math.floor(Math.min(560,game.clientWidth,viewportWidth-24,remaining)));
    document.documentElement.style.setProperty('--board-size',size+'px');
  }
  function resetGame(){session=makeSession();drawBoard();safeSave();toast('Nova partida iniciada.');}
  function undo(){if(animationBusy||modalOpen||!session.undo)return;const old=session.undo;session.cells={...old.cells};session.score=old.score;session.moves=old.moves;session.won=old.won;session.merges=old.merges??session.merges;session.milestones=old.milestones??session.milestones;session.undo=null;drawBoard();safeSave();toast('Última jogada desfeita.');}
  function closeModal(){modalOpen=false;overlay.classList.add('hidden');document.getElementById('help-btn').focus();}
  function openModal(kind){
    modalOpen=true;const title=document.getElementById('modal-title'),icon=document.getElementById('modal-icon'),copy=document.getElementById('modal-copy'),help=document.getElementById('modal-help'),actions=document.getElementById('modal-actions');
    actions.replaceChildren();help.hidden=true;help.innerHTML='';let heading='',message='',symbol='✦',buttons=[];
    if(kind==='achievements'){
      heading='Conquistas';symbol='★';message=`${unlocked.size} de ${achievements.length} desbloqueadas`;
      help.hidden=false;help.innerHTML=achievements.map(([id,name,desc])=>`<li>${unlocked.has(id)?'✓':'○'} <b>${name}</b>: ${desc}</li>`).join('');
      buttons=[['Fechar',closeModal,'primary']];
    }else if(kind==='help'){
      heading='Como jogar';symbol='?';message='Some peças iguais até atingir 3.072 nas '+boardCount+' casas hexagonais. Você pode continuar até 24.576, a conquista lendária.';
      help.hidden=false;help.innerHTML='<li><b>Teclado numérico:</b> 7 = noroeste; 9 = nordeste; 6 = leste; 3 = sudeste; 1 = sudoeste; 4 = oeste. Também funcionam os números da fileira superior.</li><li><b>Celular:</b> toque e segure o tabuleiro para mostrar as seis setas ao redor do dedo. Arraste na direção desejada para mover as peças. Soltar sem arrastar cancela a ação.</li><li>Um gesto rápido de deslizar também funciona no tabuleiro.</li><li>Duas peças iguais se somam: 3 + 3 = 6, 6 + 6 = 12 e 12 + 12 = 24. A pontuação aumenta apenas pelo valor da nova peça. Cada peça se funde uma única vez por movimento, e surge uma nova peça após a jogada.</li><li>Use <b>Desfazer</b> para voltar a última jogada. Seu progresso e recorde ficam salvos neste navegador.</li>';
      buttons=[['Entendi',closeModal,'primary']];
    }else if(kind==='restart'){
      heading='Começar outra partida?';symbol='↻';message='Seu progresso atual será reiniciado, mas seu recorde será mantido.';
      buttons=[['Cancelar',closeModal,'secondary'],['Reiniciar',()=>{closeModal();resetGame();},'primary']];
    }else if(kind==='won'){
      heading='Você chegou a 3.072!';symbol='★';message=`Você alcançou a meta e marcou ${session.score.toLocaleString('pt-BR')} pontos. Continue jogando para tentar a conquista lendária de 24.576!`;
      buttons=[['Continuar jogando',closeModal,'primary'],['Novo jogo',()=>{closeModal();resetGame();},'secondary']];
    }else if(kind==='lost'){
      heading='Fim de jogo';symbol='◆';message=`Sem movimentos disponíveis. Você fez ${session.score.toLocaleString('pt-BR')} pontos em ${session.moves} jogadas.`;
      buttons=[['Novo jogo',()=>{closeModal();resetGame();},'primary'],['Ver tabuleiro',closeModal,'secondary']];
    }
    title.textContent=heading;icon.textContent=symbol;copy.textContent=message;
    buttons.forEach(([name,action,cls])=>{const b=document.createElement('button');b.className=cls;b.textContent=name;b.addEventListener('click',action);actions.appendChild(b);});
    overlay.classList.remove('hidden');actions.querySelector('button')?.focus();
  }
  function closestDirection(dx,dy){const angle=Math.atan2(dy,dx)*180/Math.PI;let bestIndex=0,closest=Infinity;config.angles.forEach((d,i)=>{const distance=Math.abs(((angle-d+540)%360)-180);if(distance<closest){closest=distance;bestIndex=i;}});return bestIndex;}
  // A interface móvel mostra o controle após uma breve pressão. Um único
  // movimento é disparado ao cruzar o raio de seleção; soltar sem arrastar cancela.
  const radial=document.getElementById('radial-touch'),radialCenter=document.getElementById('radial-center');
  const radialArrows=[];
  config.angles.forEach((angle,index)=>{
    const target=document.createElement('div');target.className='radial-arrow';
    const rad=angle*Math.PI/180;
    target.style.transform=`translate(-50%,-50%) translate(${Math.cos(rad)*70}px,${Math.sin(rad)*70}px)`;
    target.innerHTML=`<span style="display:flex;transform:rotate(${angle+90}deg)">${controlArrow()}</span>`;
    radial.appendChild(target);radialArrows.push(target);
  });
  let pointerStart=null;
  // Vibração sutil apenas em toques, quando o navegador e o aparelho permitem.
  function vibrateTouch(state,milliseconds){
    if(state?.pointerType!=='touch')return;
    try{if(typeof navigator.vibrate==='function')navigator.vibrate(milliseconds);}catch(_){/* Vibração opcional. */}
  }
  function showRadial(state){
    const margin=100;
    radial.style.left=`${Math.max(margin,Math.min(window.innerWidth-margin,state.x))}px`;
    radial.style.top=`${Math.max(margin,Math.min(window.innerHeight-margin,state.y))}px`;
    radial.classList.remove('committed');radialCenter.lastElementChild.textContent='Arraste';
    radialArrows.forEach(arrow=>arrow.classList.remove('active'));
    radial.classList.add('visible');state.visible=true;
    vibrateTouch(state,12); // Disco aberto.
  }
  function hideRadial(){radial.classList.remove('visible','committed');radialArrows.forEach(arrow=>arrow.classList.remove('active'));}
  function releasePointer(){
    if(pointerStart?.holdTimer)clearTimeout(pointerStart.holdTimer);
    if(pointerStart&&svg.hasPointerCapture?.(pointerStart.id))try{svg.releasePointerCapture(pointerStart.id)}catch(_){}
    pointerStart=null;hideRadial();
  }
  svg.addEventListener('contextmenu',e=>e.preventDefault());
  svg.addEventListener('pointerdown',e=>{
    if(modalOpen||animationBusy||pointerStart||!e.isPrimary)return;
    const state={id:e.pointerId,pointerType:e.pointerType,x:e.clientX,y:e.clientY,visible:false,moved:false,committed:false,holdTimer:null};
    pointerStart=state;
    try{svg.setPointerCapture(e.pointerId)}catch(_){}
    state.holdTimer=setTimeout(()=>{if(pointerStart===state&&!state.moved&&!state.committed)showRadial(state);},185);
  });
  svg.addEventListener('pointermove',e=>{
    const state=pointerStart;
    if(!state||state.id!==e.pointerId)return;
    const dx=e.clientX-state.x,dy=e.clientY-state.y,distance=Math.hypot(dx,dy);
    if(!state.visible){if(distance>14){state.moved=true;clearTimeout(state.holdTimer);}return;}
    if(state.committed)return;
    const direction=closestDirection(dx,dy);
    radialArrows.forEach((arrow,index)=>arrow.classList.toggle('active',distance>17&&index===direction));
    if(distance>=49){
      state.committed=true;
      vibrateTouch(state,18); // Direção escolhida no controle radial.
      radial.classList.add('committed');radialCenter.lastElementChild.textContent='Movido';
      move(direction);
    }
  });
  svg.addEventListener('pointerup',e=>{
    const state=pointerStart;
    if(!state||state.id!==e.pointerId)return;
    const dx=e.clientX-state.x,dy=e.clientY-state.y;
    if(!state.committed&&Math.hypot(dx,dy)>25){
      vibrateTouch(state,18); // Confirma também o gesto rápido sem disco.
      move(closestDirection(dx,dy));
    }
    releasePointer();
  });
  svg.addEventListener('pointercancel',releasePointer);
  window.addEventListener('blur',releasePointer);
  document.addEventListener('keydown',e=>{
    const tag=document.activeElement?.tagName?.toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
    if(e.key==='Escape'&&modalOpen){closeModal();return;}if(modalOpen)return;
    if(e.key.toLowerCase()==='r'){e.preventDefault();openModal('restart');return;}
    if(e.key.toLowerCase()==='u'){e.preventDefault();undo();return;}
    // Usa event.code primeiro: funciona inclusive com Num Lock desligado.
    const number=e.code?.startsWith('Numpad')?e.code.slice(6):e.key;
    if(Object.hasOwn(keyDirections,number)){
      e.preventDefault();move(keyDirections[number]);
    }
  });
  let deferredInstall=null;
  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstall=event;document.getElementById('install-btn').hidden=false;});
  window.addEventListener('appinstalled',()=>{deferredInstall=null;document.getElementById('install-btn').hidden=true;});
  document.getElementById('install-btn').addEventListener('click',async()=>{if(!deferredInstall)return;const e=deferredInstall;deferredInstall=null;document.getElementById('install-btn').hidden=true;try{await e.prompt();}catch(_){}});
  if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  document.getElementById('achievements-btn').addEventListener('click',()=>openModal('achievements'));
  document.getElementById('restart-btn').addEventListener('click',()=>openModal('restart'));
  undoBtn.addEventListener('click',undo);
  document.getElementById('help-btn').addEventListener('click',()=>openModal('help'));
  document.getElementById('sound-btn').addEventListener('click',()=>{soundOn=!soundOn;document.querySelectorAll('.sound-waves').forEach(el=>el.style.opacity=soundOn?'1':'.18');safeSave();toast(soundOn?'Som ativado.':'Som desativado.');if(soundOn)sound(525);});
  overlay.addEventListener('click',event=>{if(event.target===overlay)closeModal();});
  readStorage();if(!session)session=makeSession();if(best<session.score)best=session.score;
  document.querySelectorAll('.sound-waves').forEach(el=>el.style.opacity=soundOn?'1':'.18');
  window.HEX_GAME_API={snapshot:()=>({mode:'free',rules:'sum-v2',cells:boardCount,score:session.score,moves:session.moves,largest:Math.max(0,...Object.values(session.cells))})};
  drawBoard();safeSave();fitBoard();window.addEventListener('resize',fitBoard);window.visualViewport?.addEventListener('resize',fitBoard);
})();
</script>
